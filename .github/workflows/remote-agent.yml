name: Remote agent compatibility
on:
  pull_request:
    paths:
      - 'lib/remote-*.ts'
      - 'scripts/remote-release-data.cjs'
      - 'scripts/remote-storage-*.cjs'
      - 'scripts/agent-postgres-runtime.cjs'
      - 'scripts/agent-runtime-loader.cjs'
      - 'scripts/manager-agent-resources.cjs'
      - 'scripts/agent-bundle.cjs'
      - 'scripts/dependency-audit.cjs'
      - 'scripts/http-health.cjs'
      - 'tests/remote-*.test.cjs'
      - 'db/migrations/03*.sql'
      - 'app/api/webhooks/remote/**'
      - 'scripts/manager-agent.cjs'
      - 'scripts/manager-agent-*.cjs'
      - 'scripts/remote-storage*.cjs'
      - 'scripts/database-env-rewrite.cjs'
      - 'scripts/postgres-ownership.cjs'
      - 'scripts/agent-bundle.cjs'
      - 'tests/remote-storage-switch.test.cjs'
      - 'tests/fixtures/storage-change-manager.cjs'
      - 'scripts/manager-agent-supervisor.cjs'
      - 'lib/remote-agent-updates.ts'
      - 'tests/agent-updater.test.cjs'
      - 'tests/agent-update-api.test.cjs'
      - 'db/migrations/027_remote_agent_updates.sql'
      - 'tests/remote-agent.test.cjs'
      - 'tests/remote-guided-setup.test.cjs'
      - 'lib/remote-setup-policy.ts'
      - 'lib/remote-infrastructure.ts'
      - 'lib/remote-health.ts'
      - 'lib/remote-domains.ts'
      - 'lib/server-removal*.ts'
      - 'lib/application-removal*.ts'
      - 'tests/application-removal.test.cjs'
      - 'tests/server-removal.test.cjs'
      - 'tests/remote-infrastructure.test.cjs'
      - 'db/migrations/029_remote_infrastructure.sql'
      - 'lib/remote-app-setup.ts'
      - 'lib/managed-servers.ts'
      - 'lib/server-ssh.ts'
      - 'app/api/servers/**'
      - 'scripts/bootstrap-remote-agent.*'
      - 'tests/server-ssh.test.cjs'
      - '.github/workflows/remote-agent.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  agent:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22', '24']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node --test tests/remote-agent.test.cjs tests/remote-release-data.test.cjs
      - run: node --test tests/agent-updater.test.cjs
  ssh:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test tests/server-ssh.test.cjs
      - run: node --require ./tests/register.cjs --test tests/remote-guided-setup.test.cjs tests/remote-infrastructure.test.cjs tests/remote-webhooks.test.cjs tests/remote-domain-routing.test.cjs
  guided-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: manager_setup_test
          POSTGRES_PASSWORD: isolated-setup-fixture
          POSTGRES_DB: manager_remote_test_guided
        ports: ['55439:5432']
        options: >-
          --health-cmd "pg_isready -U manager_setup_test -d manager_remote_test_guided"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: node --require ./tests/register.cjs --test --test-concurrency=1 tests/remote-guided-setup.test.cjs tests/managed-servers.test.cjs tests/agent-update-api.test.cjs tests/remote-infrastructure.test.cjs tests/server-removal.test.cjs tests/application-removal.test.cjs tests/remote-app-controls.test.cjs tests/remote-resources.test.cjs tests/remote-operations.test.cjs tests/remote-storage.test.cjs tests/remote-storage-agent.test.cjs tests/remote-storage-switch.test.cjs
        env:
          MANAGER_GUIDED_PG_LAB: '1'
          MANAGER_REMOTE_TEST_DATABASE_URL: postgresql://manager_setup_test:isolated-setup-fixture@127.0.0.1:55439/manager_remote_test_guided
