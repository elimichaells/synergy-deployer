name: Isolated remote application lifecycle
on:
  pull_request:
    paths:
      - 'scripts/manager-agent*.cjs'
      - 'scripts/agent-bundle.cjs'
      - 'scripts/windows-pidusage.cjs'
      - 'scripts/remote-release-data.cjs'
      - 'scripts/remote-storage*.cjs'
      - 'tests/remote-live-lifecycle.test.cjs'
      - 'tests/remote-agent-startup.test.cjs'
      - 'tests/agent-bundle-source.test.cjs'
      - 'tests/fixtures/*live-agent*.cjs'
      - 'tests/fixtures/manager-removal-lab.cjs'
      - 'tests/fixtures/live-database-switch.cjs'
      - 'tests/fixtures/live-database-move.cjs'
      - 'tests/fixtures/postgres-target.cjs'
      - 'tests/fixtures/storage-change-manager.cjs'
      - 'scripts/database-env-rewrite.cjs'
      - 'scripts/postgres-ownership.cjs'
      - 'lib/application-removal*.ts'
      - 'lib/managed-servers.ts'
      - '.github/workflows/remote-lifecycle.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lifecycle:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        pm2: ['6', '7']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm install --prefix "${{ runner.temp }}/manager-live-tools" --ignore-scripts --no-audit --no-fund pm2@${{ matrix.pm2 }}
      - run: node tests/fixtures/prepare-live-agent-lab.cjs
      - run: node --test tests/private-pm2-isolation.test.cjs tests/windows-pidusage.test.cjs
      - run: node --test tests/pm2-compatibility.test.cjs
      - run: node --test tests/remote-live-lifecycle.test.cjs
      - run: node --test tests/agent-bundle-source.test.cjs tests/remote-agent-startup.test.cjs
  manager-receipt:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: sudo apt-get update && sudo apt-get install -y postgresql
      - run: npm install --prefix "${{ runner.temp }}/manager-live-tools" --ignore-scripts --no-audit --no-fund pm2@7
      - run: node tests/fixtures/prepare-live-agent-lab.cjs
      - run: node tests/fixtures/run-remote-db.cjs "$(pg_config --bindir)" remote-live-lifecycle
