name: Isolated remote application lifecycle
on:
  pull_request:
    paths:
      - 'scripts/manager-agent*.cjs'
      - 'scripts/windows-pidusage.cjs'
      - 'scripts/remote-release-data.cjs'
      - 'scripts/remote-storage*.cjs'
      - 'tests/remote-live-lifecycle.test.cjs'
      - 'tests/fixtures/*live-agent*.cjs'
      - 'tests/fixtures/manager-removal-lab.cjs'
      - 'tests/fixtures/live-database-switch.cjs'
      - 'tests/fixtures/storage-change-manager.cjs'
      - 'scripts/database-env-rewrite.cjs'
      - 'scripts/postgres-ownership.cjs'
      - 'lib/application-removal*.ts'
      - 'lib/managed-servers.ts'
      - '.github/workflows/remote-lifecycle.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lifecycle:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        pm2: ['6', '7']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --prefix "${{ runner.temp }}/manager-live-tools" --ignore-scripts --no-audit --no-fund pm2@${{ matrix.pm2 }}
      - run: node tests/fixtures/prepare-live-agent-lab.cjs
      - run: node --test tests/private-pm2-isolation.test.cjs tests/windows-pidusage.test.cjs
      - run: node --test tests/remote-live-lifecycle.test.cjs
  manager-receipt:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: manager_lifecycle_test
          POSTGRES_PASSWORD: isolated-lifecycle-fixture
          POSTGRES_DB: manager_remote_test_lifecycle
        ports: ['55439:5432']
        options: >-
          --health-cmd "pg_isready -U manager_lifecycle_test -d manager_remote_test_lifecycle"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm install --prefix "${{ runner.temp }}/manager-live-tools" --ignore-scripts --no-audit --no-fund pm2@7
      - run: node tests/fixtures/prepare-live-agent-lab.cjs
      - run: node --require ./tests/register.cjs --test tests/remote-live-lifecycle.test.cjs
        env:
          MANAGER_REMOTE_TEST_DATABASE_URL: postgresql://manager_lifecycle_test:isolated-lifecycle-fixture@127.0.0.1:55439/manager_remote_test_lifecycle
